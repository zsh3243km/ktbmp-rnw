
name: KataBump Renewal Monitor

on:
  schedule:
    - cron: "17 12 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: katabump-renewal
  cancel-in-progress: false

jobs:
  renew:
    name: Check and Renew Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
      KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
      SERVER_ID: ${{ secrets.SERVER_ID }}
      HEADLESS: "true"
      TIMEOUT_MS: "20000"
      ARTIFACT_DIR: "artifacts"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Validate Configuration
        shell: bash
        run: |
          test -n "$KATABUMP_EMAIL" || {
            echo "::error::KATABUMP_EMAIL is missing."
            exit 1
          }

          test -n "$KATABUMP_PASSWORD" || {
            echo "::error::KATABUMP_PASSWORD is missing."
            exit 1
          }

      - name: Run Renewal Script
        run: python renew.py

      - name: Upload Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katabump-renewal-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
